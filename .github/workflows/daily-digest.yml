name: Weekly Agents Radar

on:
  schedule:
    # Sunday 23:00 UTC = Monday 07:00 CST (UTC+8), producing one native
    # seven-day digest at the start of each week.
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# A delayed scheduled run must not overlap a manual regeneration: both could
# build the same CST week's digest and open duplicate issues. Queue rather than
# cancel so the scheduled run reaches the guard after the manual run commits.
concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Skip a scheduled run when this week's digest already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is ${{ github.event_name }} — manual runs always proceed."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CST date, matching the digests/YYYY-MM-DD/ folder produced by the
          # native weekly digest's toCstDateStr report date.
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if gh api "repos/${{ github.repository }}/contents/digests/$DATE" --silent 2>/dev/null; then
            echo "digests/$DATE is already committed — this week's digest exists. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No digests/$DATE yet — proceeding with this week's digest."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching 50 articles) may need up to 20 min.
    timeout-minutes: 40

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run weekly digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm start

      - name: Commit digest files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            git commit -m "digest: ${DATE} weekly digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || 'agents-radar' }}

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set Pages URL
        run: |
          echo "PAGES_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || 'agents-radar' }}" >> $GITHUB_ENV

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
        run: pnpm notify

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
        run: pnpm notify:feishu

      - name: Close stale issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale
